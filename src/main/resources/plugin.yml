name: SouiLeash
version: '3.1'
main: nc.SoulLeash
api-version: '1.21'
authors: [ WMGameLive ]
description: Allow to use lead on players!
commands:
  leashplayers:
    description: Main SouiLeash command.
    usage: /<command> <reload|lang|status|debug>
    permission: leashplayers.admin
  oi:
    description: Make leashed players look at their owner
    usage: /oi
    permission: leashplayers.use
permissions:
  leashplayers.admin:
    description: admin permission.
    default: op
  leashplayers.use:
    description: allow leash other player.
    default: true
  leashplayers.leashable:
    description: allow to be leashed.
    default: not op
