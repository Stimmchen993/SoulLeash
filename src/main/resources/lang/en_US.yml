  no_permission: "&cYou do not have permission: &f{permission}"
  players_only: "&cThis command can only be used by players."
  player_not_found: "&cPlayer not found: &f{player}"
  not_owned: "&cYou do not own &f{player}&c."
  invalid_number: "&cInvalid number: &f{value}"
  anchor_entity_missing: "&cLook at a non-player entity within 8 blocks and try again."
  cannot_clearname_while_leashed: "&cYou can only clear your own leash-name when you are not currently leashed."
  select:
    success: "&aSelected &b{player}&a for leash controls."
  reload:
    success: "&aSouiLeash config reloaded. Active language: &f{lang}&a."
  lang:
    current: "&aCurrent language: &f{lang}&a."
    set: "&aLanguage updated. Active language: &f{lang}&a."
  status:
    header: "&6[SouiLeash] &eStatus"
    language: "&7Language: &f{lang}"
    permissions: "&7Permissions: &fadmin={admin} &7use=&f{use} &7leashable=&f{leashable}"
    features: "&7Features: &fleash={leash} &7follow={follow} &7effects={effects} &7summon={summon} &7fence={fence} &7bone={bone} &7food={food} &7look={look} &7chore={chore} &7portal={portal} &7respawn={respawn} &7crossworld={crossworld} &7fall={falldamage}"
  debug:
    header: "&6[SouiLeash] &eDebug"
    stats: "&7State: &fmasters={masters} &7links={links} &7tasks={tasks} &7fenceBound={fence} &7pendingTeleport={pending}"
    leash_tuning: "&7Leash tuning: &fperiod={period}t &7tp={teleport} &7hard={hard} &7mid={medium} &7soft={soft}"
    sync_tuning: "&7Sync tuning: &fjoinDelay={join}t &7portalDelay={portal}t &7effectPeriod={effects}t &7summonCd={summon}s &7foodCd={foodcooldown}ms"
  test:
    usage: "&eUsage: &f/leashplayers test <spawn|despawn|reset|run basic|mirror <start|stop|tug>>"
    spawned: "&aSpawned (or moved) your SoulLeash test subject."
