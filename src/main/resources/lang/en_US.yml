    run_basic: "&aStarted basic solo test: mirror mode enabled and a tug was triggered."
    mirror_started: "&aMirror mode started. Your test subject now applies leash pull to you."
    mirror_stopped: "&eMirror mode stopped."
    mirror_tug: "&aMirror tug applied."
  chore:
    usage: "&eUsage: &f/leashplayers chore <start|stop|status|add|chat|rename|preset> <player> ..."
    not_allowed: "&cYou can only start chore mode for yourself when unleashed, or for players you currently own."
    started_target: "&dTaskmaster has started your chore mode (issued by &f{issuer}&d)."
    started_issuer: "&aStarted chore mode for &b{player}&a."
    stopped: "&eChore mode stopped."
    completed: "&aChore mode complete. Taskmaster released your leash."
    none: "&cNo active chore mode session for that player."
    status: "&7Chore status: &f{status}"
    task: "&6[Taskmaster] &eCurrent task: &f{task}"
    task_added: "&aAdded custom task: &f{task}"
    invalid_task: "&cInvalid custom task. Use mine/gather/deliver with materials, or kill with entity type."
    start_failed: "&cFailed to start chore mode. Check player state and try again."
    invalid_chat_mode: "&cInvalid chat mode. Use &fprivate &cor &fbroadcast&c."
    invalid_rename_mode: "&cInvalid rename mode. Use &foff&c, &fon&c, or &frandom&c."
    invalid_preset: "&cInvalid preset. Use &fbuilder&c, &fhunter&c, &ffarmer&c, or &fmessenger&c."
